function esc(s=''){

}

/* MÚSICA */
function toggleMusic(){
  const player=$('audioPlayer');
  if(player.paused){
    player.play().then(()=>$('musicIcon').className='fa-solid fa-pause')
      .catch(e=>console.error('Erro ao tocar música:',e));
  }else{
    player.pause();
    $('musicIcon').className='fa-solid fa-play';
  }
}
function changePresetMusic(url){changeMusicUrl(url)}
function changeMusicUrl(url){
  if(!url)return;
  $('audioPlayer').src=url;
  $('audioPlayer').play()
    .then(()=>$('musicIcon').className='fa-solid fa-pause')
    .catch(e=>alert('Não foi possível tocar esse endereço de áudio.'));
}

async function signUp(){
  const name=$('regName').value.trim();
  const username=$('regUsername').value.trim().toLowerCase().replace(/^@/,'');
  const email=$('regEmail').value.trim();
  const password=$('regPassword').value;
  const language=$('regLanguage').value;

  if(!name||!username||!email||password.length<6){
    return status('loginStatus','Preencha todos os campos. A senha precisa ter pelo menos 6 caracteres.');
  }

  status('loginStatus','Criando sua conta...');
  try{
    const {data,error}=await db.auth.signUp({email,password});
    if(error)throw error;

    if(data.user){
      let avatar_url=null;
      const file=$('regAvatarInput').files[0];
      if(file)avatar_url=await uploadFile(file,`avatar_${data.user.id}_${Date.now()}`);

      const {error:profileError}=await db.from('user_profiles').upsert({
        user_id:data.user.id,
        full_name:name,
        username,
        language,
        avatar_url,
        updated_at:new Date().toISOString()
      },{onConflict:'user_id'});

      if(profileError)throw profileError;

      status('loginStatus',data.session?'Conta criada! Entrando...':'Conta criada! Confirme seu e-mail antes de entrar.');
    }
  }catch(error){
    status('loginStatus',showError('Cadastro',error));
  }
}

/* CALENDÁRIO E DIÁRIO */
function changeMonth(n){
  selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);
  loadMonth();
}

async function loadMonth(){
  if(!user)return;
  const first=new Date(selected.getFullYear(),selected.getMonth(),1);
  const last=new Date(selected.getFullYear(),selected.getMonth()+1,0);
  $('monthTitle').textContent=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

  const {data,error}=await db.from('diary_entries').select('*')
    .eq('user_id',user.id)
    .gte('entry_date',dateKey(first)).lte('entry_date',dateKey(last));

  if(error){console.error(error);return;}

  entries={};
  (data||[]).forEach(r=>entries[r.entry_date]=r);
  drawCalendar();
  await selectDay(selected);
}

function drawCalendar(){
  const y=selected.getFullYear(),m=selected.getMonth();
  const offset=new Date(y,m,1).getDay();
  const total=new Date(y,m+1,0).getDate();
  $('days').innerHTML='';

  for(let i=0;i<offset;i++)$('days').append(document.createElement('div'));

  for(let n=1;n<=total;n++){
    const d=new Date(y,m,n),k=dateKey(d);
    const el=document.createElement('div');
    el.className='day'+(k===dateKey(selected)?' selected':'')+
      (k===dateKey(new Date())?' today':'')+(entries[k]?' has-entry':'');
    el.textContent=n;
    el.onclick=()=>selectDay(d);
    $('days').append(el);
  }
}

async function selectDay(d){
  selected=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  drawCalendar();

  $('selectedDate').textContent=selected.toLocaleDateString('pt-BR',{
    weekday:'long',day:'numeric',month:'long',year:'numeric'
  });

  const {data,error}=await db.from('diary_entries').select('*')
    .eq('user_id',user.id).eq('entry_date',dateKey(selected)).maybeSingle();

  if(error){console.error(error);return;}
  const r=data||{};

  ['breakfast','lunch','snacks','dinner','exercise','notes'].forEach(f=>{
    $(f).value=r[f]||'';
  });
  $('water').value=r.water_ml??'';
}

async function saveEntry(){
  const v={
    breakfast:$('breakfast').value.trim(),
    lunch:$('lunch').value.trim(),
    snacks:$('snacks').value.trim(),
    dinner:$('dinner').value.trim(),
    water_ml:$('water').value===''?null:Number($('water').value),
    exercise:$('exercise').value.trim(),
    notes:$('notes').value.trim()
  };
  const k=dateKey(selected);

  const {data:old,error:findError}=await db.from('diary_entries')
    .select('id').eq('user_id',user.id).eq('entry_date',k).maybeSingle();

  if(findError)return status('diaryStatus',findError.message);

  const empty=!v.breakfast&&!v.lunch&&!v.snacks&&!v.dinner&&
    v.water_ml===null&&!v.exercise&&!v.notes;

  let result;
  if(empty&&old)result=await db.from('diary_entries').delete().eq('id',old.id);
  else if(!empty&&old)result=await db.from('diary_entries').update(v).eq('id',old.id);
  else if(!empty)result=await db.from('diary_entries').insert({user_id:user.id,entry_date:k,...v});

  if(result?.error)return status('diaryStatus',result.error.message);
  status('diaryStatus','Salvo com sucesso! 🤍');
  await loadMonth();
}

async function submitFloatingPost(){
  const content=$('modalPostContent').value.trim();
  const lower=content.toLowerCase();

  if(FORBIDDEN_WORDS.some(w=>lower.includes(w))){
    return status('modalPostStatus','Esta publicação contém termos que não podem ser postados.');
  }
  if(!content&&!currentFloatingPostImage)return;

  status('modalPostStatus','Publicando...');
  try{
    let media_url=null;
    if(currentFloatingPostImage){
      media_url=await uploadFile(currentFloatingPostImage,`post_${user.id}_${Date.now()}`);
    }
    const {error}=await db.from('posts').insert({user_id:user.id,content,media_url});
    if(error)throw error;
    closeFloatingPostModal();
    await loadFeed('all');
  }catch(error){
    status('modalPostStatus',showError('Publicação',error));
  }
}

async function saveProfile(){
  status('profileStatus','Salvando...');
  const name=$('profileName').value.trim();
  const username=$('profileUsername').value.trim().toLowerCase().replace(/^@/,'');
  const bio=$('profileBio').value.trim();
  const is_private=$('profileIsPrivate').checked;
  let avatar_url=profile.avatar_url,banner_url=profile.banner_url;

  try{
    if(editAvatarFile)avatar_url=await uploadFile(editAvatarFile,`avatar_${user.id}_${Date.now()}`);
    if(editBannerFile)banner_url=await uploadFile(editBannerFile,`banner_${user.id}_${Date.now()}`);

    const {error}=await db.from('user_profiles').upsert({
      user_id:user.id,full_name:name,username,bio,avatar_url,banner_url,is_private,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id'});

    if(error)throw error;
    closeEditProfileModal();
    await loadProfile();
  }catch(error){
    status('profileStatus',showError('Perfil',error));
  }
}

  if(element)element.classList.add('active');

async function loadProfileDataTab(tab){
  if(!user)return;
  const box=$('profileTabContent');
  box.innerHTML='<p class="muted">Carregando...</p>';

  if(tab==='posts'){
    const {data,error}=await db.from('posts').select('*')
      .eq('user_id',user.id).order('created_at',{ascending:false});
    if(error)return box.textContent=error.message;
    box.innerHTML=(data||[]).map(p=>renderPostHtml(p,profile,false)).join('')||
      '<p class="muted">Você ainda não publicou nada.</p>';
  }

  if(tab==='reposts'){
    const {data:reposts,error}=await db.from('post_reposts').select('post_id').eq('user_id',user.id);
    if(error)return box.textContent=error.message;
    const ids=(reposts||[]).map(r=>r.post_id);
    if(!ids.length)return box.innerHTML='<p class="muted">Nenhum repost ainda.</p>';

    const {data:posts}=await db.from('posts').select('*').in('id',ids)
      .order('created_at',{ascending:false});
    const authorIds=[...new Set((posts||[]).map(p=>p.user_id))];
    const {data:authors}=authorIds.length
      ?await db.from('user_profiles').select('*').in('user_id',authorIds)
      :{data:[]};
    const map={};(authors||[]).forEach(a=>map[a.user_id]=a);
    box.innerHTML=(posts||[]).map(p=>renderPostHtml(p,map[p.user_id]||{},true)).join('')||
      '<p class="muted">Nenhum repost encontrado.</p>';
  }

  if(tab==='following'||tab==='followers'){
    const col=tab==='following'?'follower_id':'following_id';
    const target=tab==='following'?'following_id':'follower_id';
    const {data:f,error}=await db.from('follows').select(target).eq(col,user.id);
    if(error)return box.textContent=error.message;
    const ids=(f||[]).map(x=>x[target]);
    if(!ids.length)return box.innerHTML='<p class="muted">Nenhum registro.</p>';

    const {data:users}=await db.from('user_profiles').select('*').in('user_id',ids);
    box.innerHTML=(users||[]).map(u=>`
      <div class="person">
        <div class="row">
          <div class="avatar" style="width:38px;height:38px">
            ${u.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc((u.full_name||'?')[0])}
          </div>
          <div><b>${esc(u.full_name||'')}</b><div class="muted">@${esc(u.username||'')}</div></div>
        </div>
        <button class="secondary" onclick="inspectProfile('${u.user_id}')">Ver Perfil</button>
      </div>`).join('');
  }
}

/* FEED */
async function loadFeed(mode='all'){
  if(!user)return;

  const {data:blocked}=await db.from('blocks').select('blocked_id').eq('blocker_id',user.id);
  const blockedIds=(blocked||[]).map(b=>b.blocked_id);

  const {data:posts,error}=await db.from('posts').select('*')
    .order('created_at',{ascending:false}).limit(50);
  if(error){$('feedList').textContent=error.message;return;}

  let rows=(posts||[]).filter(p=>!blockedIds.includes(p.user_id));

  if(mode==='following'){
    const {data:f}=await db.from('follows').select('following_id').eq('follower_id',user.id);
    const ids=(f||[]).map(x=>x.following_id);
    rows=rows.filter(p=>ids.includes(p.user_id)||p.user_id===user.id);
  }

  const ids=[...new Set(rows.map(p=>p.user_id))];
  const profs={};
  if(ids.length){
    const {data}=await db.from('user_profiles').select('*').in('user_id',ids);
    (data||[]).forEach(p=>profs[p.user_id]=p);
  }

  const postIds=rows.map(p=>p.id);
  const likes={},mineLikes=new Set(),mineReposts=new Set(),commentCounts={};

  if(postIds.length){
    const {data:l}=await db.from('post_likes').select('post_id,user_id').in('post_id',postIds);
    (l||[]).forEach(x=>{
      likes[x.post_id]=(likes[x.post_id]||0)+1;
      if(x.user_id===user.id)mineLikes.add(x.post_id);
    });

    const {data:r}=await db.from('post_reposts').select('post_id,user_id').in('post_id',postIds);
    (r||[]).forEach(x=>{if(x.user_id===user.id)mineReposts.add(x.post_id)});

    const {data:c}=await db.from('post_comments').select('post_id').in('post_id',postIds);
    (c||[]).forEach(x=>commentCounts[x.post_id]=(commentCounts[x.post_id]||0)+1);
  }

  $('feedList').innerHTML=rows.length?rows.map(p=>
    renderPostHtml(p,profs[p.user_id]||{},true,likes[p.id]||0,
      mineLikes.has(p.id),mineReposts.has(p.id),commentCounts[p.id]||0)
  ).join(''):'<p class="muted">Nenhuma publicação por aqui.</p>';
}

function renderPostHtml(p,author,interactive=true,likeCount=0,isLiked=false,isReposted=false,commentCount=0){
  const name=esc(author.full_name||'Pessoa');
  const handle=author.username?'@'+esc(author.username):'@usuario';
  const avatar=author.avatar_url?`<img src="${esc(author.avatar_url)}">`:name[0].toUpperCase();
  const isMine=p.user_id===user.id;

  return `
  <article class="post">
    <div class="post-head">
      <div class="post-user-info" onclick="inspectProfile('${p.user_id}')">
        <div class="avatar">${avatar}</div>
        <div><b>${name}</b><div class="muted">${handle} · ${new Date(p.created_at).toLocaleDateString('pt-BR')}</div></div>
      </div>
      ${isMine
        ?`<button class="ghost" onclick="openDeleteConfirmModal('${p.id}')"><i class="fa-solid fa-trash"></i></button>`
        :`<button class="ghost" onclick="openReportModal('${p.id}')"><i class="fa-solid fa-triangle-exclamation"></i></button>`}
    </div>
    <p style="margin:14px 0;line-height:1.5">${esc(p.content||'').replace(/\n/g,'<br>')}</p>
    ${p.media_url?`<img src="${esc(p.media_url)}" class="post-media">`:''}
    ${interactive?`
      <div class="post-actions">
        <button class="${isLiked?'liked':''}" onclick="toggleLike('${p.id}',${isLiked},'${p.user_id}')">
          <i class="${isLiked?'fa-solid':'fa-regular'} fa-heart"></i> ${likeCount}
        </button>
        <button class="${isReposted?'reposted':''}" onclick="toggleRepost('${p.id}',${isReposted},'${p.user_id}')">
          <i class="fa-solid fa-retweet"></i> Repostar
        </button>
        <button onclick="toggleCommentsSection('${p.id}')">
          <i class="fa-regular fa-comment"></i> ${commentCount} Comentar
        </button>
      </div>
      <div id="comments-box-${p.id}" class="comments-section hidden">
        <div id="comments-list-${p.id}"></div>
        <div class="row" style="margin-top:12px">
          <input id="comment-input-${p.id}" placeholder="Escreva um comentário..." onkeydown="if(event.key==='Enter')addComment('${p.id}','${p.user_id}')" style="margin:0">
          <button onclick="addComment('${p.id}','${p.user_id}')">Enviar</button>
        </div>
      </div>`:''}
  </article>`;
}

async function toggleLike(postId,isLiked,owner){
  const result=isLiked
    ?await db.from('post_likes').delete().eq('post_id',postId).eq('user_id',user.id)
    :await db.from('post_likes').insert({post_id:postId,user_id:user.id});
  if(result.error)return alert(result.error.message);

  if(!isLiked&&owner!==user.id){
    await db.from('notifications').insert({user_id:owner,actor_id:user.id,type:'like',post_id:postId});
  }
  loadFeed('all');
}

async function toggleRepost(postId,isReposted,owner){
  const result=isReposted
    ?await db.from('post_reposts').delete().eq('post_id',postId).eq('user_id',user.id)
    :await db.from('post_reposts').insert({post_id:postId,user_id:user.id});
  if(result.error)return alert(result.error.message);

  if(!isReposted&&owner!==user.id){
    await db.from('notifications').insert({user_id:owner,actor_id:user.id,type:'repost',post_id:postId});

async function toggleCommentsSection(id){
  const box=$('comments-box-'+id);
  box.classList.toggle('hidden');
  if(!box.classList.contains('hidden'))await loadPostComments(id);
}

async function loadPostComments(id){
  const {data,error}=await db.from('post_comments').select('*')
    .eq('post_id',id).order('created_at',{ascending:true});
  if(error)return console.error(error);

  const ids=[...new Set((data||[]).map(c=>c.user_id))];
  const {data:profiles}=ids.length
    ?await db.from('user_profiles').select('*').in('user_id',ids)
    :{data:[]};
  const authors={};(profiles||[]).forEach(p=>authors[p.user_id]=p);

async function addComment(postId,owner){
  const input=$('comment-input-'+postId);
  const content=input.value.trim();
  if(!content)return;

  const {error}=await db.from('post_comments').insert({
    post_id:postId,user_id:user.id,content
  });
  if(error)return alert(error.message);

  input.value='';
  if(owner!==user.id){
    await db.from('notifications').insert({user_id:owner,actor_id:user.id,type:'comment',post_id:postId});
  }
  await loadPostComments(postId);
  loadFeed('all');
}

/* EXPLORAR: SÓ PESQUISA QUANDO EXISTIR TEXTO */
function clearExploreSearch(){
  $('searchPeople').value='';
  $('peopleList').innerHTML='<p class="muted" style="text-align:center">Pesquise um nome ou @usuário para encontrar pessoas. 🔎</p>';
  renderRecentSearches();
}

async function searchProfilesAndPosts(){
  clearTimeout(searchTimer);
  const q=$('searchPeople').value.trim().replace(/^@/,'').toLowerCase();

  if(!q){
    $('peopleList').innerHTML='<p class="muted" style="text-align:center">Pesquise um nome ou @usuário para encontrar pessoas. 🔎</p>';
    renderRecentSearches();
    return;
  }

  $('peopleList').innerHTML='<p class="muted">Buscando...</p>';

  searchTimer=setTimeout(async()=>{
    try{
      let searches=JSON.parse(localStorage.getItem('recentSearches')||'[]');
      if(!searches.includes(q)){
        searches.unshift(q);
        searches=searches.slice(0,5);
        localStorage.setItem('recentSearches',JSON.stringify(searches));
      }
      renderRecentSearches();

      const safeQ=q.replace(/[%_]/g,'');
      const {data:users,error:userError}=await db.from('user_profiles')
        .select('*').neq('user_id',user.id)
        .or(`username.ilike.%${safeQ}%,full_name.ilike.%${safeQ}%`)
        .limit(20);
      if(userError)throw userError;

      const {data:matchingPosts,error:postError}=await db.from('posts')
        .select('*').ilike('content',`%${safeQ}%`)
        .order('created_at',{ascending:false}).limit(10);
      if(postError)throw postError;

      const authorIds=[...new Set((matchingPosts||[]).map(p=>p.user_id))];
      const {data:authors}=authorIds.length
        ?await db.from('user_profiles').select('*').in('user_id',authorIds)
        :{data:[]};
      const authorMap={};(authors||[]).forEach(a=>authorMap[a.user_id]=a);

      const usersHtml=(users||[]).map(p=>`
        <div class="person">
          <div class="row" style="cursor:pointer" onclick="inspectProfile('${p.user_id}')">
            <div class="avatar" style="width:40px;height:40px">
              ${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p.full_name||'?')[0])}
            </div>
            <div><b>${esc(p.full_name||'')}</b><div class="muted">@${esc(p.username||'')}</div></div>
          </div>
          <div class="row">
            <button class="secondary" onclick="inspectProfile('${p.user_id}')">Ver perfil</button>
            <button class="secondary" onclick="openChatFromExplore('${p.user_id}')"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>`).join('');

      const postsHtml=(matchingPosts||[]).length
        ?'<h4>Postagens encontradas</h4>'+(matchingPosts||[]).map(p=>
          renderPostHtml(p,authorMap[p.user_id]||{},true)
        ).join('')
        :'';

      $('peopleList').innerHTML=usersHtml+postsHtml||
        '<p class="muted">Nenhum resultado encontrado.</p>';
    }catch(error){
      $('peopleList').innerHTML=`<p class="muted">Erro na busca: ${esc(error.message)}</p>`;
      console.error(error);
    }
  },350);
}

function renderRecentSearches(){
  const searches=JSON.parse(localStorage.getItem('recentSearches')||'[]');
  $('recentSearchesBox').innerHTML=searches.length
    ?'Pesquisas recentes: '+searches.map(s=>
      `<span style="cursor:pointer;text-decoration:underline;margin-right:12px" onclick="$('searchPeople').value='${esc(s)}';searchProfilesAndPosts()">${esc(s)}</span>`
    ).join('')
    :'';
}
function clearRecentSearches(){
  localStorage.removeItem('recentSearches');
  renderRecentSearches();
}

async function openChatFromExplore(id){
  const {data:targetProfile,error}=await db.from('user_profiles')
    .select('*').eq('user_id',id).maybeSingle();

      .eq('follower_id',id).eq('following_id',user.id).maybeSingle();

}

      .eq('blocker_id',user.id).eq('blocked_id',id);

    await db.from('follows').delete().eq('follower_id',user.id).eq('following_id',id);
    await db.from('follows').delete().eq('follower_id',id).eq('following_id',user.id);

  loadFeed('all');
}

/* MENSAGENS */
async function loadChats(){
  if(!user)return;

  const {data,error}=await db.from('direct_messages').select('*')
    .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`)
    .order('created_at',{ascending:false});

  if(error){
    $('chatList').innerHTML=`<p class="muted">Erro ao carregar conversas: ${esc(error.message)}</p>`;
    return;
  }

  const peers=[...new Set((data||[]).map(m=>
    m.sender_id===user.id?m.receiver_id:m.sender_id
  ))];

  if(!peers.length){
    $('chatList').innerHTML='<p class="muted">Nenhuma conversa recente. Encontre alguém em Explorar para começar!</p>';
    return;
  }

  const {data:profiles,error:profileError}=await db.from('user_profiles')
    .select('*').in('user_id',peers);
  if(profileError){
    $('chatList').innerHTML=`<p class="muted">${esc(profileError.message)}</p>`;
    return;
  }

  chatProfiles={};
  (profiles||[]).forEach(p=>chatProfiles[p.user_id]=p);

  $('chatList').innerHTML=peers.map(id=>`
    <div class="person" onclick="openChat('${id}')" style="cursor:pointer">
      <div class="row">
        <div class="avatar" style="width:42px;height:42px">
          ${chatProfiles[id]?.avatar_url
            ?`<img src="${esc(chatProfiles[id].avatar_url)}">`
            :esc((chatProfiles[id]?.full_name||'?')[0])}
        </div>
        <div><b>${esc(chatProfiles[id]?.full_name||'Pessoa')}</b>
          <div class="muted">@${esc(chatProfiles[id]?.username||'')}</div>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right muted"></i>
    </div>`).join('');
}

/* CORREÇÃO PRINCIPAL: abrir a página antes de definir activeChat */
async function openChat(id){
  if(chatInterval){clearInterval(chatInterval);chatInterval=null;}

  showPage('messages');

  // showPage não pode apagar a conversa depois desta linha.
  activeChat=id;

  let p=chatProfiles[id];
  if(!p){
    const {data,error}=await db.from('user_profiles').select('*')
      .eq('user_id',id).maybeSingle();
    if(error){
      status('messageStatus','Erro ao abrir perfil: '+error.message);
      return;
    }
    p=data||{};
    chatProfiles[id]=p;
  }

  $('chatTitle').textContent=(p.full_name||'Conversa')+' · @'+(p.username||'');
  $('chatListView').classList.add('hidden');
  $('chatRoomView').classList.remove('hidden');

  await loadMessages();

  if(activeChat===id){
    chatInterval=setInterval(()=>{
      if(activeChat===id)loadMessages();
    },4000);
  }
}

function backToChatList(){
  if(chatInterval){clearInterval(chatInterval);chatInterval=null;}
  activeChat=null;
  $('chatRoomView').classList.add('hidden');
  $('chatListView').classList.remove('hidden');
  loadChats();
  checkUnreadBadges();
}

/* CARREGAR MENSAGENS */
async function loadMessages(){
  if(!activeChat||!user)return;

  const chatId=activeChat;
  const {data,error}=await db.from('direct_messages').select('*')
    .or(`and(sender_id.eq.${user.id},receiver_id.eq.${chatId}),and(sender_id.eq.${chatId},receiver_id.eq.${user.id})`)
    .order('created_at',{ascending:true});

  if(error){
    status('messageStatus','Erro ao carregar mensagens: '+error.message);
    console.error(error);
    return;
  }
  if(activeChat!==chatId)return;

  const unread=(data||[])
    .filter(m=>m.receiver_id===user.id&&!m.read_at)
    .map(m=>m.id);

  if(unread.length){
    const {error:readError}=await db.from('direct_messages')
      .update({read_at:new Date().toISOString()}).in('id',unread);
    if(readError)console.error('Erro ao marcar mensagens como lidas:',readError);
    checkUnreadBadges();
  }

  $('messageBox').innerHTML=(data||[]).map(m=>{
    const mine=m.sender_id===user.id;
    const text=m.read_at?'✓✓ lido':'✓ enviado';
    return `<div class="bubble ${mine?'mine':'other'}">
      ${esc(m.content)}
      <div class="bubble-status">${mine?text:''}</div>
    </div>`;
  }).join('');

  $('messageBox').scrollTop=$('messageBox').scrollHeight;
}

/* ENVIO DE MENSAGEM COM TRATAMENTO DE ERROS */
async function sendMessage(){
  if(!activeChat){
    status('messageStatus','Nenhuma conversa selecionada. Abra uma conversa primeiro.');
    return;
  }

  const content=$('messageInput').value.trim();
  if(!content)return;

  const receiverId=activeChat;
  const sendButton=$('messageInput').nextElementSibling;
  sendButton.disabled=true;
  status('messageStatus','Enviando...');

  try{
    const {data:targetProfile,error:profileError}=await db.from('user_profiles')
      .select('messages_from_following_only')
      .eq('user_id',receiverId).maybeSingle();

    if(profileError)throw profileError;

    if(targetProfile?.messages_from_following_only){
      const {data:isF,error:followError}=await db.from('follows')
        .select('follower_id')
        .eq('follower_id',receiverId)
        .eq('following_id',user.id)
        .maybeSingle();

      if(followError)throw followError;

      if(!isF){
        status('messageStatus','Este usuário aceita mensagens apenas de quem ele segue.');
        return;
      }
    }

    const {error}=await db.from('direct_messages').insert({
      sender_id:user.id,
      receiver_id:receiverId,
      content:content
    });

    if(error)throw error;

    $('messageInput').value='';
    status('messageStatus','Mensagem enviada! 🤍');
    await loadMessages();

  }catch(error){
    console.error('Erro ao enviar mensagem:',error);
    status('messageStatus','Não foi possível enviar: '+error.message);
  }finally{
    sendButton.disabled=false;
  }
}

function openDeleteAccountModal(){

  $('deleteAccountModal').classList.remove('hidden');
}
function closeDeleteAccountModal(){
  $('deleteAccountModal').classList.add('hidden');

}
async function executeDeleteAccount(){
  if(!user)return;
  status('deleteAccStatus','Excluindo dados...');

  try{
    const tables=['post_comments','post_likes','post_reposts','post_reports',
      'notifications','direct_messages','follows','blocks','posts','diary_entries'];

    // Apaga registros associados à conta nas tabelas em que as políticas permitirem.
    for(const table of tables){
      let result;
      if(table==='follows'){
        await db.from(table).delete().eq('follower_id',user.id);
        result=await db.from(table).delete().eq('following_id',user.id);
      }else if(table==='blocks'){
        await db.from(table).delete().eq('blocker_id',user.id);
        result=await db.from(table).delete().eq('blocked_id',user.id);
      }else if(table==='direct_messages'){
        await db.from(table).delete().eq('sender_id',user.id);
        result=await db.from(table).delete().eq('receiver_id',user.id);
      }else if(table==='notifications'){
        await db.from(table).delete().eq('user_id',user.id);
        result=await db.from(table).delete().eq('actor_id',user.id);
      }else if(table==='post_reports'){
        result=await db.from(table).delete().eq('reporter_id',user.id);
      }else if(table==='post_comments'||table==='post_likes'||table==='post_reposts'){
        result=await db.from(table).delete().eq('user_id',user.id);
      }else{
        result=await db.from(table).delete().eq('user_id',user.id);
      }
      if(result?.error)console.warn('Não foi possível limpar '+table,result.error);
    }

    const {error}=await db.from('user_profiles').delete().eq('user_id',user.id);
    if(error)throw error;

    if(chatInterval)clearInterval(chatInterval);
    await db.auth.signOut();
    closeDeleteAccountModal();
  }catch(error){
    status('deleteAccStatus','Erro ao excluir: '+error.message);
  }
}
</script>
