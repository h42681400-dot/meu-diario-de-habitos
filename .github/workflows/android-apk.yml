name: Build Cottontail Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-app]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'www/**'
      - 'icons/**'
      - 'manifest.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase for Android (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json', 'utf8')); console.log('Firebase config JSON validated.')"
            echo "HAS_FIREBASE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_FIREBASE=false" >> "$GITHUB_ENV"
            echo "Firebase não configurado: o APK será criado sem push nativo. As notificações internas do site continuam disponíveis."
          fi

      - name: Enable Firebase Google Services plugin
        if: env.HAS_FIREBASE == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"dependencies\s*\{", root_text)
              if not match:
                  raise SystemExit("Não encontrei o bloco dependencies em android/build.gradle")
              pos = match.end()
              root_text = root_text[:pos] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[pos:]
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          print("Plugin Google Services configurado.")
          PY

      - name: Generate Cottontail app icon
        run: |
          mkdir -p assets
          node -e "require('sharp')('icons/WhatsApp Image 2026-11-04 at 10.41.26.jpeg').resize(1024,1024).png().toFile('assets/icon.png')"
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cottontail-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
